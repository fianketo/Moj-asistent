name: Preuzmi podatke o parking zonama (Novi Sad)

on:
  push:
    branches: [claude/personal-assistant-app-3yx3up]
    paths: ['.github/workflows/katastar.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OpenStreetMap ulice (centar Novog Sada)
        run: |
          mkdir -p data/novisad
          Q='[out:json][timeout:180];(way["highway"]["name"](45.225,19.770,45.290,19.890););out geom;'
          for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter; do
            curl -sS --fail -m 200 --data-urlencode "data=$Q" "$u" -o data/novisad/osm-streets.json && break
          done
          ls -la data/novisad; head -c 300 data/novisad/osm-streets.json
      - name: Stranice Parking servisa (spiskovi ulica po zonama)
        run: |
          for z in ekstra-zona crvena-zona plava-zona bela-zona; do
            curl -sSL -A "Mozilla/5.0" -m 60 "https://parkingns.rs/parkiralista/$z/" -o "data/novisad/$z.html" || true
          done
          curl -sSL -A "Mozilla/5.0" -m 60 "https://parkingns.rs/parkiralista/" -o data/novisad/parkiralista.html || true
          ls -la data/novisad
      - name: Sačuvaj u granu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/novisad
          git commit -m "Podaci: OSM ulice i stranice zona za Novi Sad" || exit 0
          git pull --rebase -q
          git push
