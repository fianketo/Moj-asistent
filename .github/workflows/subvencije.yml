name: Subvencije za poljoprivrednike
on:
  push:
    branches: [claude/personal-assistant-app-3yx3up]
    paths: ['.github/workflows/subvencije.yml', 'data/subvencije/build.py']
  schedule:
    - cron: '41 */3 * * *'   # na svaka 3 sata
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/personal-assistant-app-3yx3up }
      - run: mkdir -p /tmp/out && python3 data/subvencije/build.py /tmp/out/subvencije.json "${{ github.repository }}" | tee /tmp/out/izvestaj.txt
      - name: Objavi na granu subvencije-data
        run: |
          cd /tmp/out && git init -q -b subvencije-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "Subvencije $(date -u +%FT%H:%M)"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" subvencije-data
