name: Istraži data.gov.rs (teme za asistenta)
on:
  push:
    branches: [claude/personal-assistant-app-3yx3up]
    paths: ['.github/workflows/datagov.yml', 'data/datagov/*.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 data/datagov/sepa3.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/datagov
          git commit -m "Podaci: pregled skupova na data.gov.rs" || exit 0
          git pull --rebase -q && git push
